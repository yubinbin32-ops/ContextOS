[package]
name = "contextos-desktop-win"
version = "2.6.0"
description = "ContextOS Architecture Desktop Client for Windows"
authors = ["ContextOS Team"]
edition = "2021"

[lib]
name = "contextos_desktop_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0"
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2.5"
notify = "6.1"
open = "5.1"
rfd = "0.15"
