name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contextos-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Verify and package
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build MCP bundle
        run: npm run plugin:build

      - name: Prepare standalone Node runtime
        shell: bash
        run: |
          mkdir -p .cache
          curl -sL https://nodejs.org/dist/v22.14.0/node-v22.14.0-darwin-arm64.tar.gz | tar -xzf - -C .cache --strip-components=2 node-v22.14.0-darwin-arm64/bin/node
          mv .cache/node .cache/node-darwin-arm64
          chmod +x .cache/node-darwin-arm64

      - name: Build macOS app
        shell: bash
        run: |
          xcodebuild -project apps/desktop/contextos-desktop.xcodeproj \
            -scheme contextos-desktop \
            -configuration Release \
            -derivedDataPath dist/build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            OTHER_CODE_SIGN_FLAGS="--deep" \
            build

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          APP_DIR="dist/build/Build/Products/Release/ContextOS.app"

          # 1. Prepare Standard App (ensure bin/node is removed, lightweight ~1.6MB)
          rm -f "$APP_DIR/Contents/Resources/bin/node"
          rmdir "$APP_DIR/Contents/Resources/bin" 2>/dev/null || true
          codesign --force --deep --sign - "$APP_DIR"
          (cd dist/build/Build/Products/Release && zip -r -y -q "$GITHUB_WORKSPACE/release-assets/ContextOS-macos.zip" ContextOS.app)

          # 2. Prepare Full Standalone App (with bundled standalone Node 22, ~35MB)
          mkdir -p "$APP_DIR/Contents/Resources/bin"
          cp .cache/node-darwin-arm64 "$APP_DIR/Contents/Resources/bin/node"
          chmod 755 "$APP_DIR/Contents/Resources/bin/node"
          codesign --force --deep --sign - "$APP_DIR"
          (cd dist/build/Build/Products/Release && zip -r -y -q "$GITHUB_WORKSPACE/release-assets/ContextOS-macos-full.zip" ContextOS.app)

          # 3. Server bundle & Checksums
          cp plugins/contextos/server/contextos-mcp.mjs release-assets/contextos-mcp.mjs
          cd release-assets
          shasum -a 256 ContextOS-macos.zip ContextOS-macos-full.zip contextos-mcp.mjs > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ContextOS-${{ github.ref_name }}-${{ github.run_number }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ContextOS ${{ github.ref_name }}

            Spatial architecture canvas and context optimization OS for AI coding agents. Surgical AST code reading/writing across 10+ languages, out-of-context sanitized command execution, persistent project knowledge, read-only documentation drawer, and verified C-D-C-S task lifecycles via MCP.

            ### Downloads & Getting Started

            - **macOS Full Standalone (Recommended, ~35MB):** download `ContextOS-macos-full.zip` (unzip and drag `ContextOS.app` to Applications). Bundles a standalone Node 22 runtime engine. **Zero external dependencies or Node installation required.**
            - **macOS Standard Lite (~1.6MB):** download `ContextOS-macos.zip` (unzip and drag `ContextOS.app` to Applications). Ultra-lightweight edition for developers who already have Node.js 22+ installed on macOS (via Homebrew, nvm, or official installer).
            - **Headless MCP / CLI:** `npx -y github:yubinbin32-ops/ContextOS@${{ github.ref_name }}` (for remote servers, Docker, or CLI-only setups with Node 22+).
            - **Integrity Verification:** compare your downloaded files with `SHA256SUMS`.

            The macOS build is currently ad-hoc signed. On first launch, Control-click the app and choose **Open** if macOS blocks it.
