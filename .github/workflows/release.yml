name: Build and publish release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  package:
    name: Package macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version data
        run: npm run version:sync

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'const pkg = require("./package.json").version; const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ""); if (tag !== pkg) { console.error(`Tag ${tag} does not match package.json ${pkg}`); process.exit(1); }'

      - name: Run automated checks
        run: npm test

      - name: Verify plugin bundle
        run: npm run plugin:verify

      - name: Run distribution smoke test
        run: npm run dist:smoke

      - name: Run real MCP acceptance test
        run: npm run acceptance:real

      - name: Run Swift desktop tests
        run: swift test --package-path apps/desktop

      - name: Build unsigned release package
        env:
          CONTEXTOS_PACKAGE_ARCH: ${{ matrix.arch }}
          CONTEXTOS_REQUIRE_DEVELOPER_ID: "0"
          CONTEXTOS_SIGN_IDENTITY: ""
        run: npm run desktop:package

      - name: Verify ad-hoc package signatures
        env:
          CONTEXTOS_PACKAGE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in \
            "dist/ContextOS-macos-${CONTEXTOS_PACKAGE_ARCH}.zip" \
            "dist/ContextOS-macos-full-${CONTEXTOS_PACKAGE_ARCH}.zip"; do
            verify_dir="$(mktemp -d)"
            /usr/bin/ditto -xk "$archive" "$verify_dir"
            app="$verify_dir/ContextOS.app"
            binary="$app/Contents/MacOS/ContextOS"
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
            identity="$(/usr/bin/codesign -dv --verbose=4 "$app" 2>&1)"
            grep -q '^Signature=adhoc' <<< "$identity"
            grep -q '^TeamIdentifier=not set' <<< "$identity"
            actual_arch="$(/usr/bin/lipo -archs "$binary")"
            case "$actual_arch" in
              x86_64) normalized_arch="x64" ;;
              arm64) normalized_arch="arm64" ;;
              *) normalized_arch="$actual_arch" ;;
            esac
            if [[ "$normalized_arch" != "$CONTEXTOS_PACKAGE_ARCH" ]]; then
              echo "::error title=Architecture mismatch::$archive contains $actual_arch, expected $CONTEXTOS_PACKAGE_ARCH."
              exit 1
            fi
            rm -rf "$verify_dir"
          done

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp "dist/ContextOS-macos-${{ matrix.arch }}.zip" release-assets/
          cp "dist/ContextOS-macos-full-${{ matrix.arch }}.zip" release-assets/
          cp "dist/SHA256SUMS-${{ matrix.arch }}" "release-assets/SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Upload architecture assets
        uses: actions/upload-artifact@v4
        with:
          name: contextos-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Package Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/desktop-win ci

      - name: Sync version data
        run: npm run version:sync

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'const pkg = require("./package.json").version; const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ""); if (tag !== pkg) { console.error(`Tag ${tag} does not match package.json ${pkg}`); process.exit(1); }'

      - name: Run Windows catalog tests
        run: node --test apps/desktop-win/src-tauri/src/model_catalog.test.mjs

      - name: Build Windows frontend
        run: npm run desktop:win:build

      - name: Build Windows release package
        run: node scripts/package-windows.mjs

      - name: Collect Windows release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets-win
          installers=(dist/*.exe dist/*.msi)
          if (( ${#installers[@]} == 0 )); then
            echo "::error title=Missing Windows installer::No .exe or .msi artifact was produced."
            exit 1
          fi
          cp "${installers[@]}" release-assets-win/
          cp dist/*.zip release-assets-win/
          cp dist/SHA256SUMS-windows.txt release-assets-win/

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: contextos-windows-x64
          path: release-assets-win/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [package, package-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version data
        run: npm run version:sync

      - name: Build standalone MCP bundle
        run: npm run plugin:build

      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: contextos-*
          merge-multiple: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            if [[ "$release_version" != "$package_version" ]]; then
              echo "Tag version $release_version does not match package.json version $package_version"
              exit 1
            fi
          else
            release_version="$package_version"
          fi
          tag="v${release_version}"
          prerelease="false"
          if [[ "$release_version" == *-* ]]; then
            prerelease="true"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Package complete standalone plugin
        shell: bash
        run: |
          set -euo pipefail
          plugin_package="$(mktemp -d)"
          cp -R plugins/contextos "$plugin_package/contextos-plugin"
          (
            cd "$plugin_package"
            zip -qr "$GITHUB_WORKSPACE/release-assets/contextos-plugin-${{ steps.version.outputs.version }}.zip" contextos-plugin
          )
          rm -rf "$plugin_package"

      - name: Build combined checksums
        shell: bash
        run: |
          cp plugins/contextos/server/contextos-mcp.mjs release-assets/contextos-mcp.mjs
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
              | sort -z \
              | xargs -0 shasum -a 256 > SHA256SUMS
          )

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ContextOS ${{ steps.version.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: release-assets/*
          fail_on_unmatched_files: true
