name: Model-free evaluation contracts
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: evaluation-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Offline budgets, accounting, recovery and MCP contracts
        run: node --test packages/orchestrator/test/development-*.test.mjs packages/orchestrator/test/micro-budget.test.mjs packages/mcp/test/compact-change-recovery.test.mjs packages/mcp/test/compact-mutation-status.test.mjs packages/mcp/test/compact-work-evidence.test.mjs packages/mcp/test/invalid-graph-doctor.test.mjs
      - name: Verify shipped transport
        run: npm run plugin:verify
