name: Publish MCP Registry package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build OCI image and publish metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync version data
        run: npm run version:sync

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="$(jq -r '.version' package.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag version ${GITHUB_REF_NAME#v} does not match package.json version $version"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push contextos image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/yubinbin32-ops/contextos:${{ steps.release.outputs.version }}
          labels: |
            io.modelcontextprotocol.server.name=io.github.yubinbin32-ops/contextos
            org.opencontainers.image.source=https://github.com/yubinbin32-ops/ContextOS
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Resolve release version in server metadata
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          image="ghcr.io/yubinbin32-ops/contextos:${version}"
          jq --arg version "$version" --arg image "$image" \
            '.version = $version | del(.packages[0].version) | .packages[0].identifier = $image' \
            server.json > server.release.json
          mv server.release.json server.json

      - name: Install MCP Publisher
        shell: bash
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish contextos metadata
        run: ./mcp-publisher publish
