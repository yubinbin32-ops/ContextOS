name = "contextos-cloud"
main = "worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# AUTH_TOKEN must be provided as a Worker secret: wrangler secret put AUTH_TOKEN
# Cloud access fails closed when it is absent unless ALLOW_OPEN_ACCESS is explicitly true.
ALLOWED_ORIGINS = ""
ALLOW_OPEN_ACCESS = "false"

[[d1_databases]]
binding = "DB"
database_name = "contextos-db"
